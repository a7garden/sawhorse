  -->

  <!-- App tile -->
  <rect x="104" y="104" width="816" height="816" rx="204" fill="#202326"/>

  <!-- Beam -->
  <rect x="246" y="322" width="532" height="118" rx="28" fill="#E7A23A"/>

  <!-- A-frame: the minimal structural form of a sawhorse -->
  <path d="M391 428L278 718" stroke="#F5F1E8" stroke-width="82" stroke-linecap="round"/>
  <path d="M633 428L746 718" stroke="#F5F1E8" stroke-width="82" stroke-linecap="round"/>
