<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    sawhorse app icon source.
    Identity: an amber beam and an ivory A-frame on graphite.
    Intentionally flat and simple so the mark holds at every platform icon size.
