[package]
name = "sawhorse-dashboard"
version = "1.0.0"
description = "sawhorse 운영 대시보드"
edition = "2021"

[lib]
name = "sawhorse_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
notify = "8"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
arc-swap = "1"
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.22"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls", "gzip"] }
quick-xml = "0.42.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.2"
getrandom = "0.3"
semver = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
filetime = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[profile.dev]
incremental = true
