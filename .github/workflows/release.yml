name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: bundle (${{ matrix.platform }} ${{ matrix.args }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            cliTarget: aarch64-apple-darwin
            cliBinary: sawhorse
            assetFilter: aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            cliTarget: x86_64-apple-darwin
            cliBinary: sawhorse
            assetFilter: 'x64(\.dmg|\.app\.)'
          - platform: ubuntu-latest
            args: ""
            cliTarget: x86_64-unknown-linux-gnu
            cliBinary: sawhorse
            assetFilter: 'amd64|x86_64'
          - platform: windows-latest
            # WiX (msi) cannot bundle a non-ASCII productName — nsis supports unicode.
            args: "--bundles nsis"
            cliTarget: x86_64-pc-windows-msvc
            cliBinary: sawhorse.exe
            assetFilter: 'x64-setup\.exe'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: bun install --frozen-lockfile
        working-directory: app
      - name: Build assets shared by the desktop library
        working-directory: app
        run: bun run build
      - name: Verify console CLI on the native host
        working-directory: app/src-tauri
        env:
          AWS_LC_SYS_PREBUILT_NASM: 1
        run: cargo test --locked --test cli
      - name: Build standalone CLI
        working-directory: app/src-tauri
        env:
          AWS_LC_SYS_PREBUILT_NASM: 1
        run: cargo build --locked --release --bin sawhorse --target ${{ matrix.cliTarget }}
      - name: Package standalone CLI and authoring skill
        shell: bash
        run: python scripts/cli/package.py --binary app/src-tauri/target/${{ matrix.cliTarget }}/release/${{ matrix.cliBinary }} --target ${{ matrix.cliTarget }} --version "$GITHUB_REF_NAME" --output cli-release
      - name: Clear stale assets left by earlier runs of this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_FILTER: ${{ matrix.assetFilter }}
        run: |
          assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.assets[] | "\(.id)\t\(.name)"' 2>/dev/null || true)
          rc=0
          while IFS= read -r id; do
            echo "deleting stale asset id $id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$id" || rc=1
          done < <(printf '%s\n' "$assets" | grep -E "$ASSET_FILTER" | cut -f1)
          exit $rc
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_LC_SYS_PREBUILT_NASM: 1
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "sawhorse ${{ github.ref_name }}"
          releaseBody: "Ships the distribution bundles (dmg · deb · AppImage · nsis) together with the identical Claude Code plugin under plugin/."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Attach CLI archives and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" cli-release/* --clobber
