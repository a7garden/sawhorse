name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: bundle (${{ matrix.platform }} ${{ matrix.args }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            cliTarget: aarch64-apple-darwin
            cliBinary: sawhorse
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            cliTarget: x86_64-apple-darwin
            cliBinary: sawhorse
          - platform: ubuntu-latest
            args: ""
            cliTarget: x86_64-unknown-linux-gnu
            cliBinary: sawhorse
          - platform: windows-latest
            # WiX(msi)는 비 ASCII productName 을 못 묶는다 — nsis 는 유니코드 지원.
            args: "--bundles nsis"
            cliTarget: x86_64-pc-windows-msvc
            cliBinary: sawhorse.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: app
      - name: Build assets shared by the desktop library
        working-directory: app
        run: npm run build
      - name: Verify console CLI on the native host
        working-directory: app/src-tauri
        env:
          AWS_LC_SYS_PREBUILT_NASM: 1
        run: cargo test --locked --test cli
      - name: Build standalone CLI
        working-directory: app/src-tauri
        env:
          AWS_LC_SYS_PREBUILT_NASM: 1
        run: cargo build --locked --release --bin sawhorse --target ${{ matrix.cliTarget }}
      - name: Package standalone CLI and authoring skill
        shell: bash
        run: python scripts/cli/package.py --binary app/src-tauri/target/${{ matrix.cliTarget }}/release/${{ matrix.cliBinary }} --target ${{ matrix.cliTarget }} --version "$GITHUB_REF_NAME" --output cli-release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_LC_SYS_PREBUILT_NASM: 1
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "sawhorse ${{ github.ref_name }}"
          releaseBody: "배포 번들(dmg · deb · AppImage · nsis)과 함께 같은 내용의 Claude Code 플러그인이 plugin/ 에 실려 있다."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Attach CLI archives and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" cli-release/* --clobber
